<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
</head>
<body>
  <h1>오늘의 할 일</h1>

  <!-- 달력: 오늘 날짜 (날짜 채우기는 나중에 script.js에서) -->
  <label for="today-date">오늘 날짜</label>
  <input type="date" id="today-date" readonly>

  <!-- 추가칸 -->
  <div>
    <input type="text" id="todo-input" placeholder="오늘 할 일을 적어 주세요">
    <button type="button" id="add-button">추가</button>
  </div>

  <!-- 할 일 목록 (아래는 모양 확인용 예시 한 줄) -->
  <ul id="todo-list">
    <li>
      <input type="checkbox" aria-label="완료 체크">
      <span>예시: 물 마시기</span>
      <button type="button">삭제</button>
    </li>
  </ul>
</body>
</html>

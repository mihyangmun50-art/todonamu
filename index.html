<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>오늘의 할 일</h1>

  <!-- 달력: 날짜를 골라 그날의 할 일을 본다 -->
  <label for="today-date">날짜 고르기</label>
  <input type="date" id="today-date">

  <!-- 추가칸 -->
  <div>
    <input type="text" id="todo-input" placeholder="오늘 할 일을 적어 주세요">
    <button type="button" id="add-button">추가</button>
  </div>

  <!-- 할 일 목록 (script.js가 채운다) -->
  <ul id="todo-list"></ul>

  <script src="script.js"></script>
</body>
</html>
